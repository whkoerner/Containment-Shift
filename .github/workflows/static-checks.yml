name: Static repository checks (NOT Unity tests)
on:
  push:
    branches: [main, feat/phase1a-graybox-foundation]
  pull_request:
jobs:
  repository-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate text-only repository contracts
        run: python3 tools/validate_repository.py
